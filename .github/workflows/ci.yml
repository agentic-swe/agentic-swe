name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Explicit types: omitting `types` defaults to opened/synchronize/reopened only.
    # Include ready_for_review so CI re-runs when a draft PR is marked ready (same as main-merge-source.yml).
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Supported floor is Node 22 (docs/adr/0002-node-typescript.md). Each matrix entry
      # reports as a required check `test (<version>)` in the main ruleset.
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history so PR DCO can walk base..head without missing commits.
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agents/plugin-runtime/brainstorm-server/package-lock.json

      - name: Install root dependencies (npm ci)
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install brainstorm-server dependencies (npm ci)
        run: npm ci --prefix agents/plugin-runtime/brainstorm-server --registry=https://registry.npmjs.org/

      - name: Verify pipeline layout
        run: npm run verify

      - name: Check version alignment (package + plugin manifests)
        run: npm run version:check

      - name: Validate Claude plugin manifest (if CLI on PATH)
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate "$GITHUB_WORKSPACE"
          else
            echo "::notice title=Claude CLI::claude not on PATH — skipping standalone validate (install-platform-stubs.test.js still validates manifests when claude is missing)"
          fi

      # AE-028b / PD-36: DCO 1.1 on PR commits only (range = base..head; commits on main excluded).
      # Lives inside the existing required check `test (22)` — no new required status.
      # --require-commits: refuse vacuous PASS when the PR range checks 0 non-merge commits (M3-F4).
      # merge_group: not wired — merge queue is not enabled on this repo (M3-F3; see DCO.md).
      - name: DCO check (pull requests)
        if: github.event_name == 'pull_request'
        run: node scripts/dco-check.cjs --require-commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Test (repo + platform wiring + plugin validate when claude available)
        run: npm test

      - name: Measurement bench suite (token reduction evidence)
        run: npm run bench:suite
        # Suite dogfoods pack-root .worklogs via applyTransition before portfolio so CI can
        # measure live tier_totals. Those files are gitignored; organic /work is still required
        # for auditor organic-team-learning.

      - name: Work engine CLI (help smoke)
        run: node scripts/work-engine.cjs help
